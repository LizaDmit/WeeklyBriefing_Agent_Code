    - kind: SetVariable
      id: set_feed_counts
      variable: Topic.FeedCounts
      value: ="01:" & Text(CountRows(Split(Topic.a01, "<entry>")) - 1) & " " & "02:" & Text(CountRows(Split(Topic.a02, "<entry>")) - 1) & " " & "03:" & Text(CountRows(Split(Topic.a03, "<entry>")) - 1) & " " & "04:" & Text(CountRows(Split(Topic.a04, "<entry>")) - 1) & " " & "05:" & Text(CountRows(Split(Topic.a05, "<entry>")) - 1) & " " & "06:" & Text(CountRows(Split(Topic.a06, "<entry>")) - 1) & " " & "07:" & Text(CountRows(Split(Topic.a07, "<entry>")) - 1) & " " & "08:" & Text(CountRows(Split(Topic.a08, "<entry>")) - 1) & " " & "09:" & Text(CountRows(Split(Topic.a09, "<entry>")) - 1) & " " & "10:" & Text(CountRows(Split(Topic.a10, "<entry>")) - 1) & " " & "11:" & Text(CountRows(Split(Topic.a11, "<entry>")) - 1) & " " & "12:" & Text(CountRows(Split(Topic.a12, "<entry>")) - 1) & " " & "13:" & Text(CountRows(Split(Topic.a13, "<entry>")) - 1) & " " & "14:" & Text(CountRows(Split(Topic.a14, "<entry>")) - 1) & " " & "15:" & Text(CountRows(Split(Topic.a15, "<entry>")) - 1) & " " & "16:" & Text(CountRows(Split(Topic.a16, "<entry>")) - 1) & " " & "17:" & Text(CountRows(Split(Topic.a17, "<entry>")) - 1) & " " & "18:" & Text(CountRows(Split(Topic.a18, "<entry>")) - 1) & " " & "19:" & Text(CountRows(Split(Topic.a19, "<entry>")) - 1) & " " & "20:" & Text(CountRows(Split(Topic.a20, "<entry>")) - 1) & " " & "21:" & Text(CountRows(Split(Topic.a21, "<entry>")) - 1) & " " & "22:" & Text(CountRows(Split(Topic.a22, "<entry>")) - 1) & " " & "23:" & Text(CountRows(Split(Topic.a23, "<entry>")) - 1) & " " & "24:" & Text(CountRows(Split(Topic.a24, "<entry>")) - 1) & " " & "25:" & Text(CountRows(Split(Topic.a25, "<entry>")) - 1) & " " & "26:" & Text(CountRows(Split(Topic.a26, "<entry>")) - 1) & " " & "27:" & Text(CountRows(Split(Topic.a27, "<entry>")) - 1) & " " & "28:" & Text(CountRows(Split(Topic.a28, "<entry>")) - 1) & " " & "29:" & Text(CountRows(Split(Topic.a29, "<entry>")) - 1) & " " & "30:" & Text(CountRows(Split(Topic.a30, "<entry>")) - 1)

    - kind: SendActivity
      id: dbg_feed_counts
      activity: "ENTRIES PER FEED: {Topic.FeedCounts}"

    - kind: SetVariable
      id: set_all_raw
      variable: Topic.AllRaw
      value: |-
        =Topic.a01 &
          Topic.a02 &
          Topic.a03 &
          Topic.a04 &
          Topic.a05 &
          Topic.a06 &
          Topic.a07 &
          Topic.a08 &
          Topic.a09 &
          Topic.a10 &
          Topic.a11 &
          Topic.a12 &
          Topic.a13 &
          Topic.a14 &
          Topic.a15 &
          Topic.a16 &
          Topic.a17 &
          Topic.a18 &
          Topic.a19 &
          Topic.a20 &
          Topic.a21 &
          Topic.a22 &
          Topic.a23 &
          Topic.a24 &
          Topic.a25 &
          Topic.a26 &
          Topic.a27 &
          Topic.a28 &
          Topic.a29 &
          Topic.a30

    - kind: SendActivity
      id: dbg_all_raw
      activity: ALL RAW len={Len(Topic.AllRaw)} entries={CountRows(Split(Topic.AllRaw, "<entry>")) - 1}

    - kind: SetVariable
      id: set_items
      variable: Topic.Items
      value: |-
        =ForAll(
          ForAll(
            ForAll(
              LastN(
                Split(Topic.AllRaw, "<entry>"),
                CountRows(Split(Topic.AllRaw, "<entry>")) - 1
              ),
              {
                rt: First(Split(Last(Split(First(Split(ThisRecord.Value, "</entry>")).Value, "<title")).Value, "</title>")).Value,
                rc: First(Split(Last(Split(First(Split(ThisRecord.Value, "</entry>")).Value, "<content")).Value, "</content>")).Value,
                href: First(Split(Last(Split(First(Split(ThisRecord.Value, "</entry>")).Value, "<link href=""")).Value, """")).Value,
                p: First(Split(Last(Split(First(Split(ThisRecord.Value, "</entry>")).Value, "<published>")).Value, "</published>")).Value
              }
            ),
            {
              t: Mid(ThisRecord.rt, Find(">", ThisRecord.rt) + 1),
              c: Mid(ThisRecord.rc, Find(">", ThisRecord.rc) + 1),
              u: Substitute(
                   If(
                     Find("&amp;url=", ThisRecord.href) > 0,
                     First(Split(Last(Split(ThisRecord.href, "&amp;url=")).Value, "&amp;ct=")).Value,
                     ThisRecord.href
                   ),
                   "&amp;", "&"),
              dt: DateAdd(
                    DateAdd(
                      DateAdd(
                        Date(Value(Left(ThisRecord.p, 4)), Value(Mid(ThisRecord.p, 6, 2)), Value(Mid(ThisRecord.p, 9, 2))),
                        Value(Mid(ThisRecord.p, 12, 2)),
                        TimeUnit.Hours
                      ),
                      Value(Mid(ThisRecord.p, 15, 2)),
                      TimeUnit.Minutes
                    ),
                    8,
                    TimeUnit.Hours
                  )
            }
          ),
          {
            t: Trim(
                  Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(
                    ThisRecord.t,
                    "&lt;b&gt;", ""),
                    "&lt;/b&gt;", ""),
                    "&amp;", "&"),
                    "&#39;", "'"),
                    "&quot;", """"),
                    "&nbsp;", " "),
                    "&amp;", "&"),
                    "|", "-"),
                    Char(10), " ")
                ),
            d: First(Split(Substitute(Last(Split(ThisRecord.u, "://")).Value, "www.", ""), "/")).Value,
            dt: Text(ThisRecord.dt, "yyyy-mm-dd hh:mm"),
            u: ThisRecord.u,
            c: Trim(
                  Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(
                    ThisRecord.c,
                    "&lt;b&gt;", ""),
                    "&lt;/b&gt;", ""),
                    "&amp;", "&"),
                    "&#39;", "'"),
                    "&quot;", """"),
                    "&nbsp;", " "),
                    "&amp;", "&"),
                    "|", "-"),
                    Char(10), " ")
                )
          }
        )

    - kind: SendActivity
      id: dbg_items
      activity: PARSED items={CountRows(Topic.Items)}

    - kind: SetVariable
      id: set_sorted
      variable: Topic.SortedItems
      value: =Sort(Topic.Items, u)

    - kind: SetVariable
      id: set_unique
      variable: Topic.Unique
      value: |-
        =Filter(
          ForAll(
            Sequence(CountRows(Topic.SortedItems)),
            If(
              Value = 1,
              Index(Topic.SortedItems, 1),
              If(
                Index(Topic.SortedItems, Value).u <> Index(Topic.SortedItems, Value - 1).u,
                Index(Topic.SortedItems, Value)
              )
            )
          ),
          !IsBlank(u)
        )

    - kind: SendActivity
      id: dbg_unique
      activity: AFTER DEDUP items={CountRows(Topic.Unique)}

    - kind: SetVariable
      id: set_dedup_text
      variable: Topic.Dedup
      value: |-
        =Concat(
          Topic.Unique,
          t & " | " & d & " | " & dt & " | " & u & " | " & c,
          Char(10)
        )

    - kind: SendActivity
      id: dbg_dedup_head
      activity: "DEDUP HEAD: {Left(Topic.Dedup, 1500)}"

    - kind: SendActivity
      id: dbg_runend
      activity: RUN END {IfError(Text(Now(), "yyyy-mm-dd hh:mm:ss"), "NA")}

inputType: {}
outputType: {}