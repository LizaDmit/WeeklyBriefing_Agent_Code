kind: AdaptiveDialog
beginDialog:
  kind: OnError
  id: main
  actions:
    - kind: InvokeConnectorAction
      id: send_error_alert
      input:
        binding:
          Body: "=\"<p>The weekly sector briefing <b>failed and was not sent</b>.</p><p>Error: \" & System.Error.Message & \" (code: \" & System.Error.Code & \")</p><p>To retry: wait 15-30 minutes, open WeeklyBriefing_Agent in Copilot Studio and type <b>run briefing</b> in the Test pane.</p>\""
          Subject: "=\"ACTION NEEDED: Weekly sector briefing failed\""
          To: intern@paradigmconsulting.com.hk

      output:
        kind: SingleVariableOutputBinding
        variable: Topic.SendErrorAlert

      connectionReference: cr921_TestTest.shared_office365.shared-office365-f1caab0b-3631-408a-8a6f-9ed67e0b13d1
      connectionProperties:
        name: cr921_TestTest.shared_office365.shared-office365-f1caab0b-3631-408a-8a6f-9ed67e0b13d1
        mode: Maker

      operationId: SendEmailV2

    - kind: SendActivity
      id: send_error_message
      activity: "ERROR: {System.Error.Message} (code: {System.Error.Code})"

    - kind: CancelAllDialogs
      id: cancel_all_after_error