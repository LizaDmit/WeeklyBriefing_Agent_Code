kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - run briefing

  actions:
    - kind: SetVariable
      id: set_week_start
      variable: Topic.WeekStart
      value: =DateAdd(Today(), -(Weekday(Today(), StartOfWeek.Monday) - 1) - 7, TimeUnit.Days)

    - kind: SetVariable
      id: set_window_start
      variable: Topic.WindowStartUtc
      value: =Text(DateAdd(Topic.WeekStart, -1, TimeUnit.Days), "yyyy-mm-dd") & "T16:00:00Z"

    - kind: SetVariable
      id: set_window_end
      variable: Topic.WindowEndUtc
      value: =Text(DateAdd(Topic.WeekStart, 6, TimeUnit.Days), "yyyy-mm-dd") & "T16:00:00Z"

    - kind: SendActivity
      id: dbg_window
      activity: "WINDOW (HKT): {Text(Topic.WeekStart, \"ddd d mmm\")} 00:00 to {Text(DateAdd(Topic.WeekStart, 6, TimeUnit.Days), \"ddd d mmm\")} 23:59 | UTC filter: {Topic.WindowStartUtc} to {Topic.WindowEndUtc}"

    - kind: InvokeConnectorAction
      id: invokeConnectorAction_biSz6t
      input:
        binding:
          $filter: ="Published ge '" & Topic.WindowStartUtc & "' and Published lt '" & Topic.WindowEndUtc & "'"
          $orderby: Published desc
          $top: 5000
          dataset: https://paradigmconsultinghk-my.sharepoint.com/personal/intern_paradigmconsulting_com_hk
          table: f893c9e5-9802-48d1-98bc-e1f672db3186

      output:
        kind: SingleVariableOutputBinding
        variable: Topic.GetItems

      connectionReference: cr921_TestTest.shared_sharepointonline.shared-sharepointonl-b39c5ddd-182a-4999-a04b-0b45087e8908
      connectionProperties:
        name: cr921_TestTest.shared_sharepointonline.shared-sharepointonl-b39c5ddd-182a-4999-a04b-0b45087e8908
        mode: Invoker

      dynamicOutputSchema:
        kind: Record
        properties:
          value:
            description: List of Items
            order: 0
            type:
              kind: Table
              properties:
                "{ContentType}":
                  displayName: 內容類型
                  description: 項目內容類型的名稱。
                  order: 22
                  type:
                    kind: Record
                    properties:
                      Id:
                        displayName: Id
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                      Name:
                        displayName: Name
                        order: 1
                        type: String

                "{FilenameWithExtension}":
                  displayName: 含副檔名的檔案名稱
                  description: 針對程式庫，會傳回包括副檔名的檔案名稱。針對清單，會傳回標題內容。
                  order: 17
                  type: String

                "{FullPath}":
                  displayName: 完整路徑
                  description: 項目或資料夾或檔案的完整路徑
                  order: 19
                  type: String

                "{HasAttachments}":
                  displayName: 有附件
                  description: 指出項目中是否有附件。
                  order: 23
                  type: Boolean

                "{Identifier}":
                  displayName: 識別碼
                  description: 可以在選取檔案時用於檔案相關動作的值。
                  order: 13
                  type: String

                "{IsFolder}":
                  displayName: 是資料夾
                  description: 當項目是資料夾時為 True，不是資料夾時則為 False。
                  order: 14
                  type: Boolean

                "{Link}":
                  displayName: 項目連結
                  description: 可以用來取得檔案或清單項目的連結。只有具有項目權限的人員才可以開啟連結。
                  order: 15
                  type: String

                "{ModerationComment}":
                  displayName: 與此清單項目內容核准相關聯的註解
                  description: 與清單項目仲裁相關聯的註解。
                  order: 21
                  type: String

                "{ModerationStatus}":
                  displayName: 內容核准狀態
                  description: "內容核准狀態。它可以是下列其中一種: 草稿、擱置、已核准或已拒絕"
                  order: 20
                  type: String

                "{Name}":
                  displayName: 名稱
                  description: 文件庫中的項目檔案名稱，清單中的項目顯示名稱。
                  order: 16
                  type: String

                "{Path}":
                  displayName: 資料夾路徑
                  description: 相對於站台位址的項目所在資料夾路徑。
                  order: 18
                  type: String

                "{TriggerWindowEndToken}":
                  displayName: 觸發程式視窗結束權杖
                  description: 表示目前流程檢查時間的標記。如果您想要在自上次流程檢查之後檢查一或多欄，請使用此選項。
                  order: 26
                  type: String

                "{TriggerWindowStartToken}":
                  displayName: 觸發程式視窗起始權杖
                  description: 表示上一次流程檢查時間的標記。如果您想要在自上次流程檢查之後檢查一或多欄，請使用此選項。
                  order: 25
                  type: String

                "{VersionNumber}":
                  displayName: 版本號碼
                  description: 檔案版本號碼或清單項目。
                  order: 24
                  type: String

                Author:
                  displayName: 建立者
                  description: 建立此項目的使用者。
                  order: 11
                  type:
                    kind: Record
                    properties:
                      Claims:
                        displayName: Claims
                        description: 建立此項目之使用者的內部識別碼。
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                      Department:
                        displayName: Department
                        description: 建立此項目之使用者的部門名稱。
                        order: 4
                        type: String

                      DisplayName:
                        displayName: DisplayName
                        description: 建立此項目之使用者的名稱。
                        order: 1
                        type: String

                      Email:
                        displayName: Email
                        description: 建立此項目之使用者的電子郵件地址。
                        order: 2
                        type: String

                      JobTitle:
                        displayName: JobTitle
                        description: 建立此項目之使用者的職稱。
                        order: 5
                        type: String

                      Picture:
                        displayName: Picture
                        description: 連結至建立此項目之使用者的圖片。
                        order: 3
                        type: String

                ComplianceAssetId:
                  displayName: 合規性資產識別碼
                  order: 8
                  type: String

                Created:
                  displayName: 建立時間
                  description: 建立此項目的時間。
                  order: 10
                  type: DateTime

                Editor:
                  displayName: 修改者
                  description: 上次變更此項目的使用者。
                  order: 12
                  type:
                    kind: Record
                    properties:
                      Claims:
                        displayName: Claims
                        description: 上次變更此項目之使用者的內部識別碼。
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                      Department:
                        displayName: Department
                        description: 上次變更此項目之使用者的部門名稱。
                        order: 4
                        type: String

                      DisplayName:
                        displayName: DisplayName
                        description: 上次變更此項目之使用者的名稱。
                        order: 1
                        type: String

                      Email:
                        displayName: Email
                        description: 上次變更此項目之使用者的電子郵件地址。
                        order: 2
                        type: String

                      JobTitle:
                        displayName: JobTitle
                        description: 上次變更此項目之使用者的職稱。
                        order: 5
                        type: String

                      Picture:
                        displayName: Picture
                        description: 連結到上次變更此項目之使用者的圖片。
                        order: 3
                        type: String

                ID:
                  displayName: 識別碼
                  description: 清單項目識別碼。使用此值指定要在其他清單相關動作上執行的項目。
                  order: 0
                  type: Number

                Link:
                  displayName: Link
                  order: 2
                  type: String

                Modified:
                  displayName: 修改時間
                  description: 上次變更此項目的時間。
                  order: 9
                  type: DateTime

                OData__ColorTag:
                  displayName: 色彩標記
                  order: 7
                  type: String

                Published:
                  displayName: Published
                  order: 3
                  type: DateTime

                Search:
                  displayName: Search
                  order: 6
                  type: String

                Sector:
                  displayName: Sector
                  order: 5
                  type: String

                Snippet:
                  displayName: Snippet
                  order: 4
                  type: String

                Title:
                  displayName: 標題
                  order: 1
                  type: String

      operationId: GetItems

    - kind: SendActivity
      id: sendActivity_8E9iv4
      activity: "{\"ITEMS: \" & Text(CountRows(Topic.GetItems.value))}"

    - kind: SetVariable
      id: set_articles_text
      variable: Topic.ArticlesText
      value: |-
        =Concat(
          Topic.GetItems.value,
          Text(ID) & " | " & Sector & " | " & Text(Published, "yyyy-mm-dd") & " | "
          & First(Split(Substitute(Last(Split(Link, "://")).Value, "www.", ""), "/")).Value & " | "
          & Substitute(Title, "|", "-") & " | "
          & Substitute(Left(Snippet, 300), "|", "-"),
          Char(10)
        )

    - kind: SendActivity
      id: dbg_articles
      activity: "ARTICLES chars={Len(Topic.ArticlesText)} HEAD: {Left(Topic.ArticlesText, 800)}"

    - kind: InvokeAIBuilderModelAction
      id: invokeAIBuilderModelAction_fES4Xn
      input:
        binding:
          articles: =Topic.ArticlesText

      output:
        binding:
          predictionOutput: Topic.Selection

      aIModelId: 705e91c6-a1d6-4376-bab0-f2e9e8b0ac29

    - kind: SendActivity
      id: sendActivity_NF05Bx
      activity: "{\"SELECTION:\" & Char(10) & Topic.Selection.text}"

    - kind: SetVariable
      id: set_needed_ids
      variable: Topic.NeededIds
      value: |-
        ="," & Substitute(
          Concat(
            Filter(Split(Topic.Selection.text, Char(10)), CountRows(Split(Value, "|")) >= 4),
            Last(FirstN(Split(Value, "|"), 2)).Value & "," & Last(FirstN(Split(Value, "|"), 3)).Value,
            ","
          ),
          " ", ""
        ) & ","

    - kind: SetVariable
      id: set_needed_items
      variable: Topic.NeededItems
      value: =Filter(Topic.GetItems.value, ("," & Text(ID) & ",") in Topic.NeededIds)

    - kind: SendActivity
      id: dbg_needed
      activity: NEEDED rows={CountRows(Topic.NeededItems)} ids={Topic.NeededIds}

    - kind: SetVariable
      id: set_events_text
      variable: Topic.EventsText
      value: |-
        =Concat(
          ForAll(
            Filter(Split(Topic.Selection.text, Char(10)), CountRows(Split(Value, "|")) >= 4),
            {
              s: Trim(First(Split(Value, "|")).Value),
              p: Value(Trim(Last(FirstN(Split(Value, "|"), 2)).Value)),
              o: Trim(Last(FirstN(Split(Value, "|"), 3)).Value)
            }
          ) As ev,
          With(
            {r: LookUp(Topic.NeededItems, ID = ev.p)},
            "EVENT | " & ev.s & " | " & ev.p & Char(10)
            & "PRIMARY | " & First(Split(Substitute(Last(Split(r.Link, "://")).Value, "www.", ""), "/")).Value
            & " | " & Substitute(r.Title, "|", "-") & " | " & Substitute(r.Snippet, "|", "-") & Char(10)
          )
          & If(
              ev.o = "-" Or IsBlank(ev.o),
              "",
              Concat(
                Split(ev.o, ",") As x,
                With(
                  {q: LookUp(Topic.NeededItems, ID = Value(Trim(x.Value)))},
                  "RELATED | " & First(Split(Substitute(Last(Split(q.Link, "://")).Value, "www.", ""), "/")).Value
                  & " | " & Substitute(q.Title, "|", "-") & " | " & Substitute(q.Snippet, "|", "-") & Char(10)
                )
              )
            ),
          Char(10)
        )

    - kind: SendActivity
      id: dbg_events
      activity: "EVENTS chars={Len(Topic.EventsText)} events={CountRows(Split(Topic.EventsText, \"EVENT |\")) - 1} related={CountRows(Split(Topic.EventsText, \"RELATED |\")) - 1} FULL: {Substitute(Topic.EventsText, Char(10), Char(10) & Char(10))}"

    - kind: InvokeAIBuilderModelAction
      id: invokeAIBuilderModelAction_j9pT6a
      input:
        binding:
          events: =Topic.EventsText

      output:
        binding:
          predictionOutput: Topic.Summaries

      aIModelId: 3a798b1b-6c43-4894-b22f-2b0bf9ff8476

    - kind: SendActivity
      id: dbg_summaries
      activity: "{\"SUMMARIES:\" & Char(10) & Char(10) & Substitute(Topic.Summaries.text, Char(10), Char(10) & Char(10))}"

    - kind: SetVariable
      id: set_stories
      variable: Topic.Stories
      value: |-
        =ForAll(
          Filter(Split(Topic.Summaries.text, Char(10)), CountRows(Split(Value, "|")) >= 4) As ln,
          With(
            {pid: Value(Trim(First(Split(ln.Value, "|")).Value))},
            With(
              {
                r: LookUp(Topic.NeededItems, ID = pid),
                sel: LookUp(Split(Topic.Selection.text, Char(10)), Trim(Last(FirstN(Split(Value, "|"), 2)).Value) = Text(pid))
              },
              {
                id: pid,
                sector: Trim(First(Split(sel.Value, "|")).Value),
                outlet: With(
                  {
                    mo: Trim(Last(FirstN(Split(ln.Value, "|"), 2)).Value),
                    dm: Lower(First(Split(Substitute(Last(Split(r.Link, "://")).Value, "www.", ""), "/")).Value)
                  },
                  Switch(
                    dm,
                    "info.gov.hk", "Hong Kong Government",
                    "ustr.gov", "Office of the US Trade Representative",
                    "edb.gov.sg", "Singapore Economic Development Board",
                    "foreignaffairs.house.gov", "House Foreign Affairs Committee",
                    "asianbankingandfinance.net", "Asian Banking & Finance",
                    "kedglobal.com", "KED Global",
                    "mkbn.mk.co.kr", "Pulse by Maeil Business News",
                    "technode.global", "TechNode Global",
                    "colliers.com", "Colliers", "intelligentinsurer.com", "Intelligent Insurer", "moneycontrol.com", "Moneycontrol",
                    "news.bloombergtax.com", "Bloomberg Tax",
                    If(
                      "." in mo And " - " in r.Title,
                      With(
                        {sfx: Trim(Last(Split(r.Title, " - ")).Value)},
                        If(Lower(Substitute(sfx, " ", "")) in Lower(mo), sfx, mo)
                      ),
                      mo
                    )
                  )
                ),
                headline: Trim(Last(FirstN(Split(ln.Value, "|"), 3)).Value),
                summary: Trim(Last(FirstN(Split(ln.Value, "|"), 4)).Value),
                link: r.Link,
                published: r.Published
              }
            )
          )
        )

    - kind: SendActivity
      id: dbg_stories
      activity: "{\"STORIES: \" & Text(CountRows(Topic.Stories)) & Char(10) & Char(10) & Concat(Topic.Stories, sector & \" | \" & Text(id) & \" | \" & Text(published, \"yyyy-mm-dd hh:mm\") & \" | \" & outlet & \" | \" & link, Char(10) & Char(10))}"

    - kind: SetVariable
      id: set_range_text
      variable: Topic.RangeText
      value: =Text(Topic.WeekStart, "d mmm") & " – " & Text(DateAdd(Topic.WeekStart, 6, TimeUnit.Days), "d mmm yyyy")

    - kind: SetVariable
      id: set_email_html
      variable: Topic.EmailHtml
      value: |-
        =With(
          {
            secs: Filter(
              ["Banking (Traditional & Digital)", "Private Equity", "Property (Real Estate)", "Technology", "Digital Assets & Tokenization", "E-Commerce", "Insurance", "Professional Services", "Luxury Retail", "Geopolitical Developments (China / US)"] As s,
              CountRows(Filter(Topic.Stories, sector = s.Value)) > 0
            )
          },
          With(
            {
              n: CountRows(Filter(Topic.Stories, sector in secs)),
              m: CountRows(secs)
            },
            "<table role='presentation' width='100%' cellpadding='0' cellspacing='0' style='background:#f4f4f4;'><tr><td align='center' style='padding:24px 12px;'>"
            & "<table role='presentation' width='640' cellpadding='0' cellspacing='0' style='width:640px;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#222222;'>"
            & "<tr><td style='padding:28px 32px 16px 32px;border-bottom:3px solid #1F3864;'>"
            & "<div style='font-size:22px;font-weight:bold;letter-spacing:1px;color:#1F3864;'>WEEKLY SECTOR BRIEFING</div>"
            & "<div style='font-size:14px;color:#555555;padding-top:6px;'>" & Topic.RangeText & "</div>"
            & "<div style='font-size:13px;color:#555555;padding-top:4px;'>" & Text(n) & " stories | " & Text(m) & " sectors</div>"
            & "</td></tr>"
            & Concat(
                Sequence(m) As k,
                With(
                  {sn: Last(FirstN(secs, k.Value)).Value},
                  "<tr><td style='padding:24px 32px 4px 32px;'><div style='font-size:16px;font-weight:bold;color:#1F3864;border-bottom:1px solid #D0D7E5;padding-bottom:6px;'>"
                  & Text(k.Value) & ". " & Substitute(sn, "&", "&amp;") & "</div></td></tr>"
                  & Concat(
                      Filter(Topic.Stories, sector = sn) As st,
                      With(
                        {
                          h: Substitute(Substitute(Substitute(Substitute(st.headline, UniChar(8203), ""), "&", "&amp;"), "<", "&lt;"), ">", "&gt;"),
                          o: Substitute(Substitute(st.outlet, "&", "&amp;"), "<", "&lt;"),
                          sm: Substitute(Substitute(Substitute(Substitute(st.summary, UniChar(8203), ""), "&", "&amp;"), "<", "&lt;"), ">", "&gt;"),
                          l: Substitute(Substitute(Substitute(st.link, UniChar(8203), ""), "&", "&amp;"), "'", "%27")
                        },
                        "<tr><td style='padding:12px 32px 4px 32px;'>"
                        & "<div style='font-size:15px;font-weight:bold;color:#111111;line-height:21px;'>" & h & "</div>"
                        & "<div style='font-size:12px;color:#777777;padding-top:3px;'>" & o & " | " & Text(st.published, "d mmm yyyy") & "</div>"
                        & If(sm = "-" Or IsBlank(sm), "", "<div style='font-size:14px;color:#333333;line-height:20px;padding-top:6px;'>" & sm & "</div>")
                        & If(IsBlank(l), "", "<div style='font-size:13px;padding-top:6px;'><a href='" & l & "' style='color:#0563C1;text-decoration:underline;'>Read article</a></div>")
                        & "</td></tr>"
                      )
                    )
                )
              )
            & "<tr><td style='padding:28px 32px;font-size:11px;line-height:16px;color:#999999;border-top:1px solid #e5e5e5;'>Compiled from public news sources for Paradigm Consulting Asia. Summaries are based on short article excerpts; please see the original articles for full details.</td></tr>"
            & "</table></td></tr></table>"
          )
        )

    - kind: SendActivity
      id: dbg_html
      activity: HTML chars={Len(Topic.EmailHtml)} stories in email={CountRows(Filter(Topic.Stories, sector in ["Banking (Traditional & Digital)", "Private Equity", "Property (Real Estate)", "Technology", "Digital Assets & Tokenization", "E-Commerce", "Insurance", "Professional Services", "Luxury Retail", "Geopolitical Developments (China / US)"]))} of {CountRows(Topic.Stories)}

    - kind: InvokeConnectorAction
      id: invokeConnectorAction_4MdTJ7
      input:
        binding:
          Body: =Topic.EmailHtml
          Subject: ="WEEKLY SECTOR BRIEFING | " & Topic.RangeText
          To: intern@paradigmconsulting.com.hk

      output:
        kind: SingleVariableOutputBinding
        variable: Topic.SendEmailV2

      connectionReference: cr921_TestTest.shared_office365.shared-office365-f1caab0b-3631-408a-8a6f-9ed67e0b13d1
      connectionProperties:
        name: cr921_TestTest.shared_office365.shared-office365-f1caab0b-3631-408a-8a6f-9ed67e0b13d1
        mode: Invoker

      operationId: SendEmailV2

inputType: {}
outputType: {}